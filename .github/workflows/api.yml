name: FoxMail API

# API workflow for FoxMail (snjackson044-droid/FoxMail).
# Validates the FoxMail API contract on every push / PR to main that
# touches the server, the typed client, the database, or this workflow.
#
# FoxMail's server is server/src/actions.ts (Hatch space actions).
# The client calls it with POST ./actions { action, args } via
# client/src/api.ts (createActionClient). See docs/API.md.
#
# NOTE on the build job: package.json depends on @hatch/space-sdk via a
# vendored file. The SDK tarball is stored base64-encoded as
# vendor/space-sdk.tgz.b64 (the binary itself cannot be pushed through
# the API), and the build job decodes it to vendor/space-sdk.tgz before
# `bun install`. The client bundle is NOT built here: the SDK's
# buildClient() only runs inside the Hatch artifact pipeline, so CI
# typechecks and builds the server bundle only.

on:
  # Runs every day at 06:00 UTC (01:00 EST).
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/src/api.ts"
      - "client/src/App.tsx"
      - "drizzle/**"
      - "package.json"
      - "bun.lock"
      - "scripts/api-workflow-check.mjs"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "client/src/api.ts"
      - "client/src/App.tsx"
      - "drizzle/**"
      - "package.json"
      - "bun.lock"
      - "scripts/api-workflow-check.mjs"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check FoxMail API contract
        run: node scripts/api-workflow-check.mjs

  build:
    name: Typecheck and build (Hatch SDK required)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Restore vendored SDK
        run: base64 -d vendor/space-sdk.tgz.b64 > vendor/space-sdk.tgz

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck client and server
        run: bun run typecheck

      - name: Build server bundle
        # Client bundle is built only by the Hatch artifact pipeline,
        # not by CI (the SDK's buildClient() refuses to run outside it).
        run: bun run build:server
